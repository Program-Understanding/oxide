[project]
name = "oxide"
version = "4.0.0"
description = "Oxide is a flexible, modular, distributed framework for performing analysis of data files, including executables."
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
    "pandas>=2.3.3",
    "colorama",
    "termcolor",
    "r2pipe",
    "flare-capa",
    "pyghidra>=3.0.2",
    "networkx>=3.1",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
    "sympy>=1.14.0",
    "matplotlib>=3.9.4",
    "capstone>=5.0.0.post1",
    "pyyaml>=6.0.3",
    "py-tlsh>=4.12.1",
    "pyahocorasick>=2.2.0",
    "opencv-python>=4.13.0.92",
    "python-bindiff>=0.3.4",
    "angr>=9.2.102",
    "cle>=9.2.102",
    "ollama>=0.6.1",
    "statsmodels>=0.14.6",
    "seaborn>=0.13.2",
    "unblob>=26.3.30",
    "uvicorn>=0.44.0",
    "fastapi>=0.136.0",
    "python-multipart>=0.0.26",
]

[dependency-groups]
dev = [
    "pyinstrument>=5.1.2",
    "pytest>=8.4.2",
    "ruff>=0.15.8"
]

ml = [
    "sentence-transformers>=5.1.2",
     "scikit-learn>=1.6.1",
]
# Dependencies of the `agentic_re` analyzer module (LLM-agent type recovery).
# OPTIONAL on purpose: plain oxide users never install these, which keeps the core framework
# independent of the agent stack. Install with:  pip install -e '.[agentic]'
# Versions are the ones the published measurements were produced with -- pinned exactly, because an
# agent pipeline's behaviour depends on its framework versions in ways a range would not capture.
[project.optional-dependencies]
agentic = [
    "langchain==1.3.12",
    "langchain-core==1.4.9",
    "langchain-openai==1.3.5",
    "langchain-mcp-adapters==0.3.0",
    "langgraph==1.2.9",
    "langgraph-prebuilt==1.1.0",
    "deepagents==0.6.12",
    "mcp==1.28.1",
    "openai==2.45.0",
]

[project.scripts]
oxide = "oxide.shell:main"
oxide-remote = "oxide.rshell:main"
oxide-server = "oxide.server:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project.urls]
"HomePage" = "https://github.com/Program-Understanding/oxide"
"Bug Reports" = "https://github.com/Program-Understanding/oxide/issues"
"Source" = "https://github.com/Program-Understanding/oxide"

[tool.ruff.lint]
ignore = ["E402", "I001"]

[tool.ruff.format]
exclude = ["*"]
